# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Finite-order exponential mixing does not imply the central limit theorem"
  description: >-
    A Lean 4 formalization of Theorems A, B, and C of the paper. It constructs
    stationary processes with finite-order exponential mixing and no Gaussian
    subsequential limit, then realizes the phenomenon in analytic and smooth
    dynamical systems.
  authors:
    - "Bernat Bassols Cornudella"
    - "Matheus M. Castro"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Bernat Bassols Cornudella"
    - "Matheus M. Castro"

classification:
  arxiv: ["math.DS", "math.PR"]
  msc2020: ["37A25", "37D20", "60F05", "60G10"]

sources:
  - title: "Finite-order exponential mixing does not imply the central limit theorem"
    authors:
      - "Bernat Bassols Cornudella"
      - "Matheus M. Castro"
    id: "arXiv:2610.17162"
    type: "paper"
    location: "https://arxiv.org/abs/2610.17162"
    relationship: "formalizes"
    license: "CC BY-NC-ND 4.0"
    author_endorsement: "participated"

related_formalizations: []

status:
  scope: >-
    The formalization proves Theorems A, B, and C as described in the cited
    paper. Theorem C gives the stationary symbolic construction and its five
    conclusions. Theorem A gives the analytic Anosov torus realization.
    Theorem B gives the smooth physical realization on compact smooth surfaces,
    including disconnected surfaces. The general perturbation theorem near an
    arbitrary given map described in the paper is not formalized. See the
    project README for the precise statements, constructions, and qualifications.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "FiniteOrderMixing.theoremA"
      file: "FiniteOrderMixing/TheoremA.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "FiniteOrderMixing.theoremB"
      file: "FiniteOrderMixing/TheoremB.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []
    - declaration: "FiniteOrderMixing.theoremC"
      file: "FiniteOrderMixing/TheoremC.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"
      literature_dependencies: []

