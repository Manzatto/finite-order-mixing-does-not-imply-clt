fidelity:
  divergences: >-
    Theorem B formalizes the smooth surface realization described in the
    README, not the paper's general arbitrary-small-perturbation theorem. Other
    construction details and qualifications are documented in the README.

review:
  status: "self-assessed"
  reviewers:
    - "none reported"
  notes: >-
    The paper states that the authors take full responsibility for correctness.
    Lean kernel checking and the axiom audit are documented in the README. No
    independent mathematical review is reported.

alignment:
  namespace: "FiniteOrderMixing"
  statements:
