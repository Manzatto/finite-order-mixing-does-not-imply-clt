      framework: "OpenAI ChatGPT"
      tool_setup: >-
        The paper reports use as a research assistant and AI assistance in
        developing and revising the Lean formalization. Lean's kernel checks
        the resulting proofs.
      cost:
        wall_time: "not reported"
        spend_usd: "not tracked"
        hardware: "not reported"
      prompting_notes: "not reported"
    - method: "agent"
      models:
        - "OpenAI ChatGPT 6.0 (Luna)"
      framework: "Copilot SDK in VS Code"
      tool_setup: >-
        Used for Palomar submission packaging and statement wrappers; it did
        not author or alter the existing proof terms.
      cost:
        wall_time: "not tracked"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: "Assisted with registry preparation, not proof development."
    - method: "agent"
      models:
        - "OpenAI GPT-6 (Codex)"
      framework: "OpenAI Codex"
      tool_setup: >-
        Audited submission readiness, corrected the independent Challenge's
